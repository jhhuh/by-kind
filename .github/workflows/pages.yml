name: build and publish

on:
  schedule:
    - cron: "0 6 * * *"        # daily; the nixpkgs-unstable channel advances every few days
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "model/**"
      - "data/taxonomy.yaml"
      - "data/legacy_mapping.yaml"
      - "tests/**"
      - "scripts/build.sh"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race; do not cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Everything runs inside the flake devShell, so CI and local use the
      # identical environment. There is no second dependency list to drift.
      - name: Build
        run: nix develop -c ./scripts/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
