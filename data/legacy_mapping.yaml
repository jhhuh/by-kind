# ---------------------------------------------------------------------------
# depth3 overrides — only where the 3rd component carries real meaning, or
# where the family's members are a different KIND than the parent implies.
# ---------------------------------------------------------------------------
depth3:
  # applications/networking is the worst offender at depth 2: it lumps browsers,
  # mail clients and IRC together. This is why depth-3 overrides exist at all.
  applications/networking/browsers:           {domain: web,         kind: application}
  applications/networking/feedreaders:        {domain: web,         kind: application}
  applications/networking/newsreaders:        {domain: web,         kind: application}
  applications/networking/mailreaders:        {domain: email,       kind: application}
  applications/networking/instant-messengers: {domain: chat,        kind: application}
  applications/networking/irc:                {domain: chat,        kind: application}
  applications/networking/cluster:            {domain: cloud,       kind: cli-tool}
  applications/networking/sync:               {domain: filesystems, kind: cli-tool}
  applications/networking/p2p:                {domain: networking,  kind: application}
  applications/networking/remote:             {domain: networking,  kind: application}

  applications/science/logic:                 {domain: math,        kind: cli-tool}
  applications/science/math:                  {domain: math,        kind: application}
  applications/science/electronics:           {domain: electronics, kind: application}
  applications/science/biology:               {domain: biology,     kind: cli-tool}
  applications/science/chemistry:             {domain: biology,     kind: application}
  applications/science/astronomy:             {domain: science,     kind: application}
  applications/science/physics:               {domain: science,     kind: cli-tool}
  applications/science/machine-learning:      {domain: science,     kind: application}
  applications/science/computer-architecture: {domain: science,     kind: cli-tool}
  applications/science/robotics:              {domain: science,     kind: application}
  applications/science/networking:            {domain: science,     kind: application}
  applications/science/misc:                  {domain: science,     kind: application}

  # families whose members are plugins/extensions, not instances of the parent
