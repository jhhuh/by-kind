# Legacy pkgs/<top>/<sub>[/<sub2>] path -> (domain, kind).
#
# This is the label source: packages that have NOT yet migrated to pkgs/by-name/
# still carry their category in their path. Mapping those paths onto the two
# facets in taxonomy.yaml turns them into training labels.
#
# `domain: null` means the path constrains kind but carries no domain signal
# (e.g. development/libraries) — such rows train the kind model only.
#
# MUST be total over every observed depth-2 path. Verified by tests.
#
# depth3 overrides win over depth2. They exist only where the third path
# component is SEMANTIC (applications/networking/browsers -> web), not where it
# is a package-family name (applications/editors/vscode is a family, but is
# overridden anyway because those rows are plugins, not editors).

version: 1

# Not packages — nixpkgs plumbing. Excluded from training entirely.
exclude:
  - "top-level"
  - "stdenv"

depth2:
  # --- applications -------------------------------------------------------
  applications/audio:              {domain: audio,          kind: application}
  applications/video:              {domain: video,          kind: application}
  applications/graphics:           {domain: graphics,       kind: application}
  applications/editors:            {domain: editors,        kind: application}
  applications/office:             {domain: office,         kind: application}
  applications/networking:         {domain: networking,     kind: application}
  applications/science:            {domain: science,        kind: application}
  applications/emulators:          {domain: emulators,      kind: application}
  applications/virtualization:     {domain: virtualization, kind: application}
  applications/window-managers:    {domain: desktop,        kind: application}
  applications/display-managers:   {domain: desktop,        kind: application}
  applications/terminal-emulators: {domain: terminal,       kind: application}
  applications/version-management: {domain: vcs,            kind: cli-tool}
  applications/backup:             {domain: backup,         kind: application}
  applications/radio:              {domain: radio,          kind: application}
  applications/gis:                {domain: geo,            kind: application}
  applications/system:             {domain: system,         kind: application}
  applications/misc:               {domain: null,           kind: application}

  # --- tools --------------------------------------------------------------
  tools/typesetting:        {domain: typesetting,  kind: cli-tool}
  tools/text:               {domain: text,         kind: cli-tool}
  tools/networking:         {domain: networking,   kind: cli-tool}
  tools/security:           {domain: security,     kind: cli-tool}
  tools/system:             {domain: system,       kind: cli-tool}
  tools/filesystems:        {domain: filesystems,  kind: cli-tool}
  tools/compression:        {domain: compression,  kind: cli-tool}
  tools/backup:             {domain: backup,       kind: cli-tool}
  tools/package-management: {domain: development,  kind: cli-tool}
  tools/games:              {domain: games,        kind: cli-tool}
  tools/inputmethods:       {domain: localization, kind: application}
  tools/misc:               {domain: null,         kind: cli-tool}

  # --- servers ------------------------------------------------------------
  servers/sql:            {domain: database,        kind: server}
  servers/nosql:          {domain: database,        kind: server}
  servers/search:         {domain: database,        kind: server}
  servers/hbase:          {domain: database,        kind: server}
