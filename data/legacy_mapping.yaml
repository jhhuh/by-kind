  servers/http:           {domain: web,             kind: server}
  servers/varnish:        {domain: web,             kind: server}
  servers/web-apps:       {domain: web,             kind: server}
  servers/nextcloud:      {domain: web,             kind: server}
  servers/mail:           {domain: email,           kind: server}
  servers/roundcube:      {domain: email,           kind: server}
  servers/rainloop:       {domain: email,           kind: server}
  servers/monitoring:     {domain: monitoring,      kind: server}
  servers/icingaweb2:     {domain: monitoring,      kind: server}
  servers/home-assistant: {domain: home-automation, kind: server}
